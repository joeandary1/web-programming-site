<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Joe Andary's GIN446 Web Programming portfolio.">
    <title>{% block title %}Web Programming Portfolio{% endblock %}</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS Scroll Animations CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

    <header class="site-header">
        <div class="container header-content">
            <a class="site-logo" href="{{ url_for('home') }}" aria-label="Portfolio home">
                <i class="fa-solid fa-code"></i>
            </a>
            <div class="site-heading">
                <p class="eyebrow">GIN446 · Web Programming</p>
                <p class="site-title">Joe Andary</p>
            </div>
        </div>

        {% if request.endpoint != 'home' %}
        <nav class="site-nav" aria-label="Main navigation">
            <div class="container nav-links">
                <a href="{{ url_for('home') }}"><i class="fa-solid fa-house"></i> Home</a>
                <a href="{{ url_for('internet_history') }}"><i class="fa-solid fa-globe"></i> Internet History</a>
                <a href="{{ url_for('web_history') }}"><i class="fa-solid fa-laptop-code"></i> Web History</a>
                <a href="{{ url_for('submit_profile') }}"><i class="fa-solid fa-user-graduate"></i> Profile</a>
            </div>
        </nav>
        {% endif %}
    </header>

    <main class="container page-content {% if request.endpoint == 'submit_profile' and request.method == 'POST' %}profile-result{% endif %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p><i class="fa-brands fa-python"></i> Built with Flask & Render</p>
            <p>Created for GIN446 Web Programming, USEK (Fall 2026–2027).</p>
        </div>
    </footer>

    <!-- AOS Scroll Animations JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize animations
        AOS.init({
            duration: 800,
            once: true,
            offset: 50
        });
    </script>
</body>
</html>
