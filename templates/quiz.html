{% extends "base.html" %} 
{% block title %} Quiz {% endblock %} 
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}" />
<!-- Add Confetti JS -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
{% endblock %} 
{% block content%}
<main class="container" data-aos="fade-up">
  <section id="quizPanel">
    <p id="progress"></p>
    <h2 id="questionText"></h2>
    <div id="choices"></div>
    <div class="navigation">
      <button id="firstBtn" onclick="goFirst()"><i class="fa-solid fa-backward-fast"></i> First</button>
      <button id="previousBtn" onclick="goPrevious()"><i class="fa-solid fa-chevron-left"></i> Prev</button>
      <button id="nextBtn" onclick="goNext()">Next <i class="fa-solid fa-chevron-right"></i></button>
      <button id="lastBtn" onclick="goLast()">Last <i class="fa-solid fa-forward-fast"></i></button>
    </div>
    <button class="submit" onclick="submitQuiz()"><i class="fa-solid fa-check-double"></i> Submit Quiz</button>
  </section>
  <section id="resultsPanel" style="display: none;">
    <h2><i class="fa-solid fa-chart-pie"></i> Quiz Results</h2>
    <p id="scoreText"></p>
    <p id="percentageText"></p>
    <p id="performanceText"></p>
    <h3><i class="fa-solid fa-list-check"></i> Correction</h3>
    <pre id="correction"></pre>
  </section>
</main>
<script src="{{ url_for('static', filename='quiz.js') }}"></script>
{% endblock %}
